<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container animated login-container"><h2>Регистрация</h2> {% if error %}
    <div class="error">{{ error }}</div> {% endif %}
    <form method="post" action="{{ url_for('register') }}"><input type="text" name="login" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required> <input type="password"
                                                                                     name="confirm_password"
                                                                                     placeholder="Подтвердите пароль"
                                                                                     required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <a href="{{ url_for('login') }}" class="back-link">Перейти к авторизации</a></div>
</body>
</html>
